directories:
  output: dist-electron
  buildResources: build
appId: com.gaays.ai-note
productName: AI Note Generator
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - node_modules/**/*
extraResources:
  - from: ../backend/dist/video-note-backend
    to: backend/video-note-backend
    filter:
      - '**/*'
  - from: ../Output
    to: Output
    filter:
      - '**/*'
  - from: ../Subtitles
    to: Subtitles
    filter:
      - '**/*'
  - from: ../Prompts
    to: Prompts
    filter:
      - '**/*'
win:
  target: nsis
  icon: public/favicon.ico
mac:
  target: dmg
  icon: public/favicon.ico
linux:
  target: AppImage
  icon: public/favicon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
electronVersion: 33.4.11
